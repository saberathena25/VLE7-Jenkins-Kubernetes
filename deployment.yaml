apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle7-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle7-app
  template:
    metadata:
      labels:
        app: vle7-app
    spec:
      containers:
        - name: vle7-container
          image: vle7-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
